<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — TECHZONE</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-box {
            max-width: 600px;
        }

        .error-number {
            font-size: clamp(100px, 20vw, 190px);
            font-weight: 900;
            color: transparent;
            background: linear-gradient(90deg, #a33cff, #f05cff);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 0 60px #a33cff55;
        }

        .error-box h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .error-box p {
            color: #aaa5bb;
            line-height: 1.7;
        }

    </style>

</head>

<body>

    <main class="error-box">

        <div class="error-number">404</div>

        <h1>Page Not Found</h1>

        <p>
            The page you are looking for does not exist
            or may have been moved.
        </p>

        <a href="index.html" class="gold-button">
            Back to TECHZONE →
        </a>

    </main>

</body>

</html>
